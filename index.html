<style>
@font-face{font-family:"Vazirmatn FD";src:url(fonts/Vazirmatn-FD-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Vazirmatn FD";src:url(fonts/Vazirmatn-FD-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Vazirmatn FD";src:url(fonts/Vazirmatn-FD-Black.woff2) format("woff2");font-weight:900;font-display:swap}
:root{
  --ink:#151312;--muted:#5f5852;--paper:#fffaf5;--bg:#f6e3d6;--edge:#cbbcae;--bad:#b3261e;
  --c0:#f6e3d6;--c1:#d9eee0;--c2:#f6ecb6;--c3:#e4dcf6;--c4:#d5e6f5;--c5:#f5d6de;--c6:#e7e3cb;--c7:#d3ecea;--c8:#efdcc0;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn FD",Tahoma,sans-serif;font-size:16.5px;line-height:1.9;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.wrap{max-width:600px;margin:0 auto;padding:0 20px calc(28px + env(safe-area-inset-bottom))}
.mark{display:block;text-align:center;font-weight:900;font-size:15px;padding-top:22px;opacity:.9;text-decoration:none}
.kicker{font-weight:700;font-size:17px;margin:26px 0 0}
.display{font-weight:900;font-size:clamp(56px,17vw,92px);line-height:1.04;margin:2px 0 14px;letter-spacing:-.5px}
.lead{font-size:17.5px;margin:0 0 6px}
.art{display:block;width:min(100%,340px);height:auto;margin:22px auto 18px}
h2{font-weight:900;font-size:27px;line-height:1.35;margin:44px 0 14px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 26px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:17px;border:2px solid var(--ink);cursor:pointer;text-decoration:none;line-height:1.2;-webkit-tap-highlight-color:transparent;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.light{background:var(--paper);color:var(--ink)}
.btn.block{display:flex;width:100%}
.btn svg{flex:none}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:15px}
.cta{margin:22px 0 6px}
.cta .linkbtn{display:block;margin:10px auto 0}
.note-saved{text-align:center;font-size:14.5px;color:var(--muted);margin-top:8px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:20px;box-shadow:0 4px 0 var(--ink);margin:0 0 18px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 52px 0 0;margin:0 0 20px;counter-increment:s}
.steps li::before{content:counter(s,persian);position:absolute;right:0;top:2px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;line-height:1}
.steps b{display:block;font-weight:900;font-size:18px;line-height:1.5}
.modes{display:grid;gap:12px;margin:0 0 6px}
.mode{border:2px solid var(--ink);border-radius:22px;padding:16px 18px;box-shadow:0 4px 0 var(--ink)}
.mode h3{font-weight:900;font-size:21px;margin:0 0 2px;line-height:1.5}
.mode .pr{font-weight:900;font-size:26px;line-height:1.5;margin:0 0 4px}
.mode .pr small{font-weight:700;font-size:15px;color:var(--muted)}
.mode p{margin:0;font-size:15.5px}
.bul{margin:0;padding:0 20px 0 0}
.bul li{margin:0 0 8px}
.banner{background:var(--c1);display:flex;flex-direction:column;gap:10px}
footer{margin:46px 0 0;padding-top:18px;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px}
footer b{font-weight:900}
footer a{text-decoration:none;direction:ltr;unicode-bidi:isolate}
/* form */
.prog{display:flex;gap:6px;margin:22px 0 0}
.prog span{flex:1;height:7px;border-radius:9px;background:rgba(21,19,18,.14)}
.prog span.on{background:var(--ink)}
.stephead{border:2px solid var(--ink);border-radius:22px;padding:18px 20px 16px;margin:16px 0 24px;box-shadow:0 4px 0 var(--ink)}
.stephead .no{font-weight:700;font-size:14.5px}
.stephead h1{font-weight:900;font-size:clamp(28px,8vw,36px);line-height:1.3;margin:2px 0 6px}
.stephead p{margin:0}
.intro{background:var(--paper);border-radius:18px;padding:14px 16px;margin:0 0 22px;font-size:15.5px;border:2px dashed var(--edge)}
.q{margin:0 0 26px;padding:0;border:0;min-width:0}
.qt{display:block;font-weight:700;font-size:17px;line-height:1.75;margin:0 0 6px;padding:0}
.opt{font-weight:400;font-size:13.5px;color:var(--muted);margin-right:6px;white-space:nowrap}
.qd{color:var(--muted);font-size:14.5px;line-height:1.85;margin:-2px 0 10px}
input[type=text]::placeholder,textarea::placeholder{color:#a79e95;opacity:1}
input[type=text],textarea{width:100%;font:400 16.5px/1.9 "Vazirmatn FD",Tahoma,sans-serif;color:var(--ink);background:#fff;border:2px solid var(--edge);border-radius:14px;padding:11px 14px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
textarea{min-height:132px;resize:vertical;display:block}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
.choice{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:2px solid var(--edge);border-radius:14px;background:#fff;margin:0 0 8px;cursor:pointer;line-height:1.75;-webkit-tap-highlight-color:transparent}
.choice input{flex:none;width:20px;height:20px;margin:5px 0 0;accent-color:var(--ink)}
.choice.sel{border-color:var(--ink);background:#fff6ec}
.choice .od{display:block;font-size:14px;color:var(--muted);line-height:1.7;margin-top:2px}
.choice.big b{font-weight:900;font-size:17.5px}
.err{display:none;color:var(--bad);font-size:14px;margin:6px 0 0}
.q.bad .err{display:block}
.q.bad input[type=text],.q.bad textarea,.q.bad .choice{border-color:var(--bad)}
.nav{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:8px;background:linear-gradient(to top,var(--bg) 78%,rgba(246,227,214,0))}
.nav .btn{min-height:52px}
.nav .next{flex:1}
.saved{font-size:13.5px;color:var(--muted);text-align:center;min-height:22px;margin:4px 0 0;transition:opacity .3s}
/* after */
.okhead{display:flex;align-items:center;gap:14px;margin:30px 0 8px}
.okhead h1{font-weight:900;font-size:clamp(34px,10vw,46px);line-height:1.2;margin:0}
.okhead svg{flex:none}
.cardno{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:900;font-size:clamp(24px,7.4vw,32px);letter-spacing:1.5px;margin:10px 0 4px;white-space:nowrap}
.cardname{text-align:center;font-weight:700;margin:0 0 14px}
.amount{text-align:center;font-weight:900;font-size:28px;line-height:1.5;margin:0 0 2px}
.pill{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--edge);border-radius:14px;padding:8px;margin:6px 0 14px}
.pill strong{font-weight:900;font-size:18px;padding:0 8px;overflow-wrap:anywhere}
.pill .btn{min-height:42px;padding:0 16px;font-size:15px}
.cardA{background:var(--c4)}
.cardB{background:var(--c2)}
.cardC{background:var(--c3)}
.card h3{font-weight:900;font-size:20px;margin:0 0 6px;line-height:1.5}
.help{background:var(--c5)}
.help ul{margin:6px 0 0;padding:0 20px 0 0}
.help a{font-weight:900;text-decoration:none;border-bottom:2px solid var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(246,227,214,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30;font-weight:700;font-size:18px}
.overlay.show{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(21,19,18,.18);border-top-color:var(--ink);animation:r 0.9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.alert{background:#fff;border:2px solid var(--bad);color:var(--bad);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px;display:none}
.alert.show{display:block}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (min-width:640px){.wrap{padding-left:28px;padding-right:28px}.modes{grid-template-columns:1fr 1fr}}
</style>
</head>

function optTag(q) { return q.req ? '' : '<span class="opt">(اختیاری)</span>'; }

function findQ(id) {

  if (id === MODE) {
    // The mode decides which questions and consent line are shown, so start those afresh.
    answers[CONSENT] = [];
    if (modeOf() === 'solo') delete answers[CODE];
    var y = window.scrollY;
    renderStep(step, true);
    window.scrollTo(0, y);
    return;
  }
  Array.prototype.forEach.call(boxes, function (x) { x.parentNode.classList.toggle('sel', x.checked); });
  clearBad(b);
  saveDraft();
}
function filled(q) {
  var v = answers[q.id];
  if (Array.isArray(v)) return v.some(function (x) { var i = q.o.indexOf(x); return i >= 0 && optVisible(q, i); });
  return typeof v === 'string' && v.trim().length > 0;
}
function validate(i) {
  var first = null;
  PAGES[i].items.forEach(function (q) {
    if (!visible(q)) return;
    var node = app.querySelector('[data-q="' + q.id + '"]');
    var bad = q.req && !filled(q);
    node.classList.toggle('bad', bad);
    if (bad && !first) first = node;
  });
  if (first) {
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    var f = first.querySelector('input,textarea');
    if (f && f.type === 'text' || f && f.tagName === 'TEXTAREA') setTimeout(function () { try { f.focus({ preventScroll: true }); } catch (e) {} }, 350);
    return false;
  }
  return true;
}

/* ---------- submit ---------- */
var sending = false;
var pendingCode = null;
function submit() {
  if (sending) return;
  sending = true;
  var solo = modeOf() === 'solo';
  if (solo && !pendingCode) pendingCode = soloCode();
  var body = new URLSearchParams();
  PAGES.forEach(function (p) {
    p.items.forEach(function (q) {
      if (!visible(q)) return;
      var v = answers[q.id];
      if (Array.isArray(v)) v.forEach(function (x) { var i = q.o.indexOf(x); if (i >= 0 && optVisible(q, i)) body.append('entry.' + q.id, x); });
      else if (typeof v === 'string' && v.trim()) body.append('entry.' + q.id, v.trim());
    });
  });
  if (solo) body.append('entry.' + CODE, pendingCode);
  body.append('fvv', '1');
  body.append('pageHistory', '0,1,2,3,4,5,6'); // the pages of the Google Form, not ours
  var alertEl = document.getElementById('alert');
  if (alertEl) alertEl.classList.remove('show');
  overlay.classList.add('show');
  var ctl = typeof AbortController === 'function' ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 30000);
  fetch(ACTION, { method: 'POST', mode: 'no-cors', body: body, signal: ctl ? ctl.signal : undefined })
    .then(function () {
      clearTimeout(timer); sending = false; overlay.classList.remove('show');
      afterSubmit(solo ? pendingCode : String(answers[CODE] || '').trim());
    }, function () {
      clearTimeout(timer); sending = false; overlay.classList.remove('show');
      var a = document.getElementById('alert');
      if (a) {
        a.textContent = 'فرستاده نشد. اینترنت یا فیلترشکنت رو چک کن و دوباره «فرستادن روایت» رو بزن؛ نوشته‌هات پاک نشده.';
        a.classList.add('show');
        a.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
}
function afterSubmit(code) {
  var danger = answers[DANGER] || [];
  var flagged = danger.some(function (x) { return x !== NONE; });
  submitted = true;
  if (flagged) {
    store.del(K_DRAFT); store.del(K_DONE);
    answers = {}; step = 0; lastDone = null; pendingCode = null;
    history.replaceState({ v: 'safe' }, '');
    renderSafe();
  } else {
    lastDone = { code: code, name: String(answers[NAME] || '').trim(), mode: modeOf() || 'couple', t: Date.now() };
    store.set(K_DONE, lastDone);
    store.del(K_DRAFT);
    answers = {}; step = 0; pendingCode = null;
    history.replaceState({ v: 'pay' }, '');
    renderPay();
  }
}

/* ---------- after ---------- */
function renderPay() {
  var done = store.get(K_DONE) || lastDone || {};
  var code = done.code || '';
  var solo = done.mode === 'solo';
  var n = 0;
  function num() { n++; return fa(n) + '. '; }
  var html =
    '<a class="mark" href="https://instagram.com/' + IG + '" target="_blank" rel="noopener">فروغمند</a>' +
    '<div class="okhead">' + CHECK + '<h1>روایتت رسید</h1></div>' +
    '<p>مرسی که وقت گذاشتی و نوشتی. حالا این‌ها مونده:</p>';
  if (!solo) {
    html += '<div class="card cardA"><h3>' + num() + 'روایت پارتنرت</h3><p>اگه پارتنرت هنوز ننوشته، لینک همین صفحه رو براش بفرست. همون کلمه‌ی رمز رو بنویسه تا دو روایت به هم وصل بشن.</p><button class="btn block light" data-act="share">فرستادن لینک برای پارتنرم</button></div>';
  }
  html += '<div class="card cardB"><h3>' + num() + 'پرداخت</h3>' +
    (solo
      ? '<p class="amount">' + PRICE_SOLO + '</p><p class="small" style="text-align:center;margin:0 0 10px">هزینه‌ی دیباگ یک نفره</p>'
      : '<p class="amount">نفری ' + PRICE_EACH + '</p><p class="small" style="text-align:center;margin:0 0 10px">می‌تونی فقط سهم خودت رو بدی، یا هر دو سهم رو یک‌جا (' + PRICE_BOTH + ').</p>') +
    '<p>به این کارت واریز کن:</p>' +
    '<div class="cardno">' + CARD_SHOW + '</div><p class="cardname">به نام ' + esc(CARD_NAME) + '</p>' +
    '<button class="btn block" data-act="copycard">کپی شماره کارت</button></div>';
  html += '<div class="card cardC"><h3>' + num() + 'فرستادن رسید</h3>' +
    (solo ? '' :
      '<fieldset class="q" style="margin:0 0 14px"><legend class="qt">کدوم رو واریز کردی؟</legend>' +
      '<label class="choice sel"><input type="radio" name="amt" value="1" checked><span>سهم خودم: ' + PRICE_EACH + '</span></label>' +
      '<label class="choice"><input type="radio" name="amt" value="2"><span>هر دو سهم: ' + PRICE_BOTH + '</span></label></fieldset>') +
    '<p>دکمه‌ی پایین ربات تلگرام ما رو باز می‌کنه. اون‌جا دکمه‌ی <span dir="ltr">Start</span> (شروع) رو بزن، بعد عکس رسید رو بفرست و زیرش ' + (solo ? 'این کد' : 'کلمه‌ی رمزتون') + ' رو بنویس:</p>' +
    (code ? '<div class="pill"><strong dir="auto">' + esc(code) + '</strong><button class="btn light" data-act="copycode">کپی</button></div>' : '') +
    '<a class="btn block" id="tglink" href="' + botLink(done, solo ? 's' : '1') + '" target="_blank" rel="noopener">' + TG + 'فرستادن رسید به ربات تلگرام</a>' +
    '<p class="small muted" style="margin:10px 0 0">ممکنه چند ساعت طول بکشه تا ربات جواب بده، ولی رسیدت به دستمون می‌رسه. اگه تلگرام باز نشد، تو تلگرام <span dir="ltr">@' + BOT_TG + '</span> رو سرچ کن و رسید رو اون‌جا بفرست.</p></div>';
  html += '<p>' + (solo
      ? 'وقتی پرداخت تأیید شد، جواب تو تلگرام، به همون آیدی‌ای که نوشتی، فرستاده می‌شه.'
      : 'وقتی هر دو روایت رسید و پرداخت تأیید شد، جواب مشترک‌تون تو تلگرام، به آیدی‌هایی که نوشتید، فرستاده می‌شه.') + '</p>' +
    '<button class="linkbtn" data-act="home">برگشت به صفحه‌ی اول</button>' + FOOT;
  app.innerHTML = html;
  bindActs();
  app.querySelectorAll('input[name=amt]').forEach(function (r) {
    r.addEventListener('change', function () {
      app.querySelectorAll('input[name=amt]').forEach(function (x) { x.parentNode.classList.toggle('sel', x.checked); });
      var a = document.getElementById('tglink');
      if (a) a.href = botLink(done, r.value);
    });
  });
  scrollTop();
}
function b64url(str) {
  var bin = '';
  new TextEncoder().encode(str).forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function botLink(done, kind) {
  var start = 'r' + kind + '_' + b64url(String(done.code || '').trim());
  if (start.length > 64) start = 'r' + kind + '_';
  return 'https://t.me/' + BOT_TG + '?start=' + start;
}

function renderSafe() {
  app.innerHTML =
    '<div class="okhead">' + CHECK + '<h1>روایتت رسید</h1></div>' +
    '<p>از چیزی که تو بخش خصوصی نوشتی، فکر می‌کنیم دیباگ رابطه الان کمک مناسبی برای شما نیست. وقتی تو یه رابطه ترس، تهدید یا آسیب هست، اول از همه امنیت خودت مهمه، نه پیدا کردن باگ.</p>' +
    '<p>برای همین لازم نیست هزینه‌ای پرداخت کنی. ما خودمون تو تلگرام، فقط با خودت، در تماس می‌گیریم.</p>' +
    '<div class="card help"><h3>اگه الان احساس خطر می‌کنی</h3><ul>' +
      '<li>اورژانس اجتماعی: <a href="tel:123">۱۲۳</a></li>' +
      '<li>صدای مشاور بهزیستی: <a href="tel:1480">۱۴۸۰</a></li>' +
      '<li>اگه بیرون از ایرانی: شماره‌ی اضطراری همون کشور</li>' +
    '</ul></div>' +
    '<p class="small muted">چیزی از نوشته‌هات روی این گوشی نمونده.</p>' +
    '<button class="btn block ghost" data-act="exit">خروج سریع از این صفحه</button>';
  bindActs();
  scrollTop();
}

/* ---------- actions & routing ---------- */
function startForm() {
  if (!hasDraft()) step = 0;
  history.pushState({ v: 'form' }, '');
  renderStep(step);
}
function bindActs() {
  app.querySelectorAll('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var act = b.getAttribute('data-act');
      if (act === 'start') startForm();
      else if (act === 'reset') {
        if (window.confirm && !window.confirm('همه‌ی نوشته‌هات پاک بشه و از اول شروع کنی؟')) return;
        answers = {}; step = 0; store.del(K_DRAFT); startForm();
      }
      else if (act === 'next') {
        if (!validate(step)) return;
        if (step === PAGES.length - 1) submit(); else { step++; renderStep(step); }
      }
      else if (act === 'back') {
        if (step === 0) { saveDraft(true); if (history.state && history.state.v === 'form') history.back(); else renderHome(); }
        else { step--; renderStep(step); }
      }
      else if (act === 'pay') { history.pushState({ v: 'pay' }, ''); renderPay(); }
      else if (act === 'home') { history.replaceState({ v: 'home' }, ''); renderHome(); scrollTop(); }
      else if (act === 'copycard') copy(CARD, 'شماره کارت کپی شد');
      else if (act === 'copycode') { var d = store.get(K_DONE) || lastDone || {}; copy(d.code || '', (d.mode === 'solo' ? 'کد' : 'کلمه‌ی رمز') + ' کپی شد'); }
      else if (act === 'share') sharePartner();

      else if (act === 'exit') { try { location.replace('https://www.google.com/'); } catch (e2) { location.href = 'https://www.google.com/'; } }
    });
  });
}
function sharePartner() {
  var url = siteUrl();
  var text = 'لینک «دیباگ رابطه»: تنهایی پرش کن و همون کلمه‌ی رمزمون رو بنویس.';
  if (navigator.share) {
    navigator.share({ title: 'دیباگ رابطه', text: text, url: url }).catch(function (e) {
      if (!e || e.name !== 'AbortError') copy(url, 'لینک کپی شد؛ برای پارتنرت بفرستش');
    });
  } else copy(url, 'لینک کپی شد؛ برای پارتنرت بفرستش');
}
window.addEventListener('popstate', function (e) {
  var s = e.state || { v: 'home' };
  if (s.v === 'form' && !submitted) renderStep(step);
  else if (s.v === 'pay') renderPay();
  else if (s.v === 'safe') renderSafe();
  else { saveDraft(true); renderHome(); }
});
window.addEventListener('pagehide', function () { if (!submitted && hasDraft()) saveDraft(true); });

var initial = history.state && history.state.v;
if (initial === 'pay' && (store.get(K_DONE))) renderPay();
else if (initial === 'safe') renderSafe();
else if (initial === 'form' && hasDraft()) renderStep(step);
else { history.replaceState({ v: 'home' }, ''); renderHome(); }
})();
</script>
